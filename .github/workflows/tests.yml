name: Tests

on: [push, pull_request]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: usb-link-watchdog
        run: ./tests/usb-link-watchdog-test.sh -v

  integration:
    name: Integration tests (DietPi ${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [Bookworm, Trixie]
    steps:
      - uses: actions/checkout@v4

      # The DietPi container image is ~60 MB; keep it between runs so the suite
      # is not re-downloading it on every push.
      - name: Cache DietPi container image
        uses: actions/cache@v4
        with:
          path: ~/.cache/dietpi-images
          key: dietpi-${{ matrix.distro }}-x86_64-${{ hashFiles('tests/docker/extract-dietpi-rootfs.sh') }}

      - name: Run integration tests
        env:
          DIETPI_DISTRO: ${{ matrix.distro }}
        # Lint runs in its own workflow (shellcheck.yml), so skip it here.
        run: |
          DIETPI_CACHE_DIR="$HOME/.cache/dietpi-images" COVERAGE_MIN=100 \
            ./tests/run-integration-tests.sh --no-lint

  vm:
    name: VM boot test (DietPi ${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [Bookworm]
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and make KVM usable
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 sshpass
          # GitHub's runners have /dev/kvm but it is not group-accessible by default
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          # DietPi's first run setup checks connectivity with ping, and QEMU's
          # user-mode networking only carries ICMP if unprivileged ping sockets
          # are allowed.
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

      - name: Cache DietPi VM image
        uses: actions/cache@v4
        with:
          path: ~/.cache/dietpi-vm
          key: dietpi-vm-${{ matrix.distro }}-${{ hashFiles('tests/vm/inject.sh') }}

      - name: Boot the VM and check the first boot
        run: |
          DIETPI_CACHE_DIR="$HOME/.cache/dietpi-vm" \
            ./tests/vm/run-vm-test.sh --distro ${{ matrix.distro }} --timeout 900

      - name: Serial log
        if: always()
        run: tail -200 /tmp/teslausb-vm-serial.log || true
